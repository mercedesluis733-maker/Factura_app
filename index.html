<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factura a un Clic · Tu Solución</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18304c;background:#f2f5fb}*{box-sizing:border-box}body{margin:0}header{background:#123a77;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:21px}nav{display:flex;gap:7px;overflow:auto;padding:12px;background:white;border-bottom:1px solid #dce4ef}button{border:0;background:#245cc0;color:white;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:650}button.secondary{background:#e9eef7;color:#244266}button.danger{background:#b63845}nav button{white-space:nowrap}nav button.active{background:#123a77}main{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #163e6810}h2{margin:0 0 18px}h3{margin:18px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:block;font-size:13px;font-weight:650;margin-bottom:4px}input,select,textarea{width:100%;border:1px solid #cbd6e5;border-radius:8px;padding:11px;font:inherit;background:white;color:#18304c}textarea{min-height:65px}.field{margin-bottom:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}td,th{text-align:left;padding:11px;border-bottom:1px solid #e5ebf3}th{background:#f5f7fc}.muted{color:#62758b;font-size:13px}.total{text-align:right;font-size:22px;font-weight:750;margin-top:14px}.hidden{display:none!important}.pill{display:inline-block;background:#e6efff;color:#18488c;border-radius:20px;padding:4px 9px}.line{display:grid;grid-template-columns:3fr .8fr 1fr .8fr auto;gap:8px;margin-bottom:8px;align-items:end}.line input{min-width:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary .panel{margin:0}.summary strong{font-size:24px}.right{text-align:right}#toast{position:fixed;bottom:18px;right:18px;background:#19375b;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:99}#printArea{display:none} @media(max-width:680px){.grid,.three,.summary{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line .wide{grid-column:1/-1}header strong{font-size:17px}button{padding:10px 12px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:12px;color:black;font:13px Arial}#printArea table{min-width:0}#printArea td,#printArea th{padding:7px}#printArea .print-head{display:flex;justify-content:space-between}#printArea h1{font-size:24px}}
</style></head><body><header><strong>🧾 Factura a un Clic <small>· Tu Solución</small></strong><span id="companyTag">Mi empresa</span></header><nav id="nav"></nav><main id="app"></main><div id="toast"></div><div id="printArea"></div><script>
'use strict';
const KEY='factura_un_clic_v1';const empty=()=>({company:{name:'',phone:'',email:'',address:'',tax:'',currency:'USD',payment:'',logo:''},clients:[],products:[],invoices:[],quotes:[]});let db;try{db={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db=empty()};let page='facturas',editing=null,lines=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-DO',{style:'currency',currency:db.company.currency||'USD'}).format(Number(n)||0),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),today=()=>new Date().toISOString().slice(0,10);function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));$('companyTag').textContent=db.company.name||'Mi empresa'}catch(e){alert('No se pudo guardar. Comprueba el almacenamiento disponible.')}}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function field(id,label,value='',type='text',other=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${other}></div>`}function get(id){return $(id)?.value?.trim()||''}function nav(){let pages=[['facturas','Facturas'],['presupuestos','Presupuestos'],['clientes','Clientes'],['productos','Productos'],['informes','Informes'],['herramientas','Herramientas']];$('nav').innerHTML=pages.map(([p,t])=>`<button class="${page===p?'active':'secondary'}" onclick="go('${p}')">${t}</button>`).join('')}function go(p){page=p;editing=null;render()}function render(){nav();$('companyTag').textContent=db.company.name||'Mi empresa';if(page==='facturas'||page==='presupuestos')listing(page==='facturas'?'invoices':'quotes');else if(page==='clientes')people();else if(page==='productos')products();else if(page==='herramientas')settings();else reports()}
function listing(kind){let arr=db[kind],isInv=kind==='invoices',label=isInv?'Factura':'Presupuesto';$('app').innerHTML=`<div class="panel"><h2>${isInv?'Facturas':'Presupuestos'}</h2><button onclick="editor('${kind}')">+ Nuevo ${label.toLowerCase()}</button><div class="scroll"><table><thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${arr.length?arr.slice().reverse().map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.date)}</td><td>${esc(x.clientName)}</td><td>${money(x.total)}</td><td><button class="secondary" onclick="editor('${kind}','${x.id}')">Editar</button> <button class="secondary" onclick="printDoc('${kind}','${x.id}')">Imprimir/PDF</button> <button class="secondary" onclick="sendDoc('${kind}','${x.id}')">WhatsApp</button> ${!isInv?`<button onclick="convert('${x.id}')">Facturar</button>`:''} <button class="danger" onclick="removeItem('${kind}','${x.id}')">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="5">Todavía no hay documentos guardados.</td></tr>'}</tbody></table></div></div>`}
function editor(kind,id){page=kind==='invoices'?'facturas':'presupuestos';editing={kind,id:id||null};let old=db[kind].find(x=>x.id===id)||{},label=kind==='invoices'?'Factura':'Presupuesto';lines=old.lines?structuredClone(old.lines):[{desc:'',qty:1,price:0}];$('app').innerHTML=`<div class="panel"><h2>${id?'Editar':'Nueva'} ${label.toLowerCase()}</h2><div class="grid">${field('number','Número',old.number||`${kind==='invoices'?'FAC':'PRE'}-${String(db[kind].length+1).padStart(4,'0')}`)}${field('date','Fecha',old.date||today(),'date')}<div class="field"><label>Cliente guardado</label><select id="clientSelect" onchange="selectClient()"><option value="">Escribir manualmente</option>${db.clients.map(c=>`<option value="${c.id}" ${old.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${field('clientName','Nombre del cliente',old.clientName||'')}${field('clientPhone','Teléfono del cliente',old.clientPhone||'','tel')}${field('clientAddress','Dirección',old.clientAddress||'')}</div><h3>Conceptos</h3><div id="lines"></div><button class="secondary" onclick="addLine()">+ Agregar concepto</button><div class="grid" style="margin-top:15px">${field('tax','Impuesto (%)',old.tax??0,'number','min="0" step="0.01" oninput="calc()"')}${field('discount','Descuento (importe)',old.discount??0,'number','min="0" step="0.01" oninput="calc()"')}</div><div class="field"><label>Notas</label><textarea id="notes">${esc(old.notes||'')}</textarea></div><div id="total" class="total"></div><div class="actions"><button onclick="saveDoc()">Guardar</button><button class="secondary" onclick="go('${page}')">Cancelar</button></div></div>`;drawLines();calc()}
function selectClient(){let c=db.clients.find(c=>c.id===get('clientSelect'));if(c){$('clientName').value=c.name;$('clientPhone').value=c.phone||'';$('clientAddress').value=c.address||''}}function readLines(){lines=lines.map((l,i)=>({desc:get('d'+i),qty:Math.max(0,Number(get('q'+i))||0),price:Math.max(0,Number(get('p'+i))||0)}))}function drawLines(){ $('lines').innerHTML=lines.map((l,i)=>`<div class="line"><div class="wide"><label>Descripción</label><input id="d${i}" value="${esc(l.desc)}" list="savedProducts" oninput="productFill(${i})"></div><div><label>Cantidad</label><input id="q${i}" type="number" min="0" step="0.01" value="${l.qty}" oninput="calc()"></div><div><label>Precio</label><input id="p${i}" type="number" min="0" step="0.01" value="${l.price}" oninput="calc()"></div><div><label>Subtotal</label><div id="s${i}" style="padding:10px 0">${money(l.qty*l.price)}</div></div><button class="danger" onclick="delLine(${i})">×</button></div>`).join('')+`<datalist id="savedProducts">${db.products.map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist>`}function productFill(i){let p=db.products.find(p=>p.name.toLowerCase()===get('d'+i).toLowerCase());if(p){$('p'+i).value=p.price;calc()}}function addLine(){readLines();lines.push({desc:'',qty:1,price:0});drawLines();calc()}function delLine(i){readLines();lines.splice(i,1);if(!lines.length)lines=[{desc:'',qty:1,price:0}];drawLines();calc()}function totals(ls,tax,discount){let sub=ls.reduce((a,l)=>a+l.qty*l.price,0),t=sub*tax/100;return {sub,t,total:Math.max(0,sub+t-discount)}}function calc(){readLines();let a=totals(lines,Number(get('tax'))||0,Number(get('discount'))||0);lines.forEach((l,i)=>{if($('s'+i))$('s'+i).textContent=money(l.qty*l.price)});$('total').textContent=`Subtotal: ${money(a.sub)} · Impuesto: ${money(a.t)} · Total: ${money(a.total)}`;return a}function saveDoc(){let a=calc(),kind=editing.kind;if(!get('clientName'))return alert('Escribe el nombre del cliente.');if(!lines.some(l=>l.desc&&l.qty>0))return alert('Agrega al menos un concepto con descripción y cantidad.');let number=get('number');if(!number)return alert('Introduce un número.');if(db[kind].some(x=>x.number===number&&x.id!==editing.id))return alert('Ese número ya existe.');let x={id:editing.id||uid(),number,date:get('date'),clientId:get('clientSelect'),clientName:get('clientName'),clientPhone:get('clientPhone'),clientAddress:get('clientAddress'),lines:structuredClone(lines),tax:Number(get('tax'))||0,discount:Number(get('discount'))||0,notes:get('notes'),total:a.total};let i=db[kind].findIndex(y=>y.id===x.id);if(i>=0)db[kind][i]=x;else db[kind].push(x);persist();editing=null;listing(kind);toast('Documento guardado correctamente')}
function removeItem(kind,id){if(confirm('¿Eliminar este registro definitivamente?')){db[kind]=db[kind].filter(x=>x.id!==id);persist();render()}}function convert(id){let x=db.quotes.find(x=>x.id===id);if(!x)return;let n=structuredClone(x);n.id=uid();n.number='FAC-'+String(db.invoices.length+1).padStart(4,'0');n.date=today();db.invoices.push(n);persist();page='facturas';render();toast('Presupuesto convertido en factura')}
function docHTML(kind,x){let c=db.company,t=totals(x.lines,x.tax,x.discount);return `<div class="print-head"><div>${c.logo?`<img src="${c.logo}" style="max-height:80px;max-width:150px">`:''}<h1>${esc(c.name||'Mi empresa')}</h1>${esc(c.address)}<p>${esc(c.phone)} ${esc(c.email)}</p><p>${esc(c.tax)}</p></div><div><h1>${kind==='invoices'?'FACTURA':'PRESUPUESTO'}</h1><b>${esc(x.number)}</b><p>${esc(x.date)}</p></div></div><hr><p><b>Cliente:</b> ${esc(x.clientName)}<br>${esc(x.clientPhone)}<br>${esc(x.clientAddress)}</p><table><thead><tr><th>Concepto</th><th>Cant.</th><th>Precio</th><th>Importe</th></tr></thead><tbody>${x.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div class="right"><p>Subtotal: ${money(t.sub)}</p><p>Impuesto (${x.tax}%): ${money(t.t)}</p><p>Descuento: ${money(x.discount)}</p><h2>Total: ${money(t.total)}</h2></div><p>${esc(x.notes)}</p><p><b>Métodos de pago:</b> ${esc(c.payment)}</p>`}function printDoc(kind,id){let x=db[kind].find(x=>x.id===id);if(!x)return;$('printArea').innerHTML=docHTML(kind,x);window.print()}function sendDoc(kind,id){let x=db[kind].find(x=>x.id===id);if(!x)return;let label=kind==='invoices'?'Factura':'Presupuesto';let msg=`${label} ${x.number}\nEmpresa: ${db.company.name||'Mi empresa'}\nCliente: ${x.clientName}\nFecha: ${x.date}\n${x.lines.map(l=>`${l.desc} (${l.qty} × ${money(l.price)}) = ${money(l.qty*l.price)}`).join('\n')}\nTOTAL: ${money(x.total)}\n${db.company.payment||''}`;let phone=x.clientPhone.replace(/\D/g,'');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}
function people(){ $('app').innerHTML=`<div class="panel"><h2>Clientes</h2><div class="grid">${field('cname','Nombre')}${field('cphone','Teléfono','','tel')}${field('caddress','Dirección')}${field('cemail','Correo','','email')}</div><button onclick="saveClient()">Agregar cliente</button><div class="scroll"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Acción</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td><button class="secondary" onclick="editClient('${c.id}')">Editar</button> <button class="danger" onclick="removeItem('clients','${c.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}function saveClient(){if(!get('cname'))return alert('Escribe el nombre');let c={id:uid(),name:get('cname'),phone:get('cphone'),address:get('caddress'),email:get('cemail')};db.clients.push(c);persist();people()}function editClient(id){let c=db.clients.find(c=>c.id===id);if(!c)return;let name=prompt('Nombre',c.name);if(name===null)return;c.name=name.trim()||c.name;let phone=prompt('Teléfono',c.phone);if(phone!==null)c.phone=phone;let address=prompt('Dirección',c.address);if(address!==null)c.address=address;persist();people()}
function products(){$('app').innerHTML=`<div class="panel"><h2>Productos y servicios</h2><div class="grid">${field('pname','Nombre del producto o servicio')}${field('pprice','Precio',0,'number','min="0" step="0.01"')}</div><button onclick="saveProduct()">Agregar producto</button><div class="scroll"><table><thead><tr><th>Producto</th><th>Precio</th><th>Acción</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td><button class="secondary" onclick="editProduct('${p.id}')">Editar</button> <button class="danger" onclick="removeItem('products','${p.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}function saveProduct(){if(!get('pname'))return alert('Escribe el nombre');db.products.push({id:uid(),name:get('pname'),price:Math.max(0,Number(get('pprice'))||0)});persist();products()}function editProduct(id){let p=db.products.find(p=>p.id===id);if(!p)return;let name=prompt('Producto',p.name);if(name===null)return;p.name=name.trim()||p.name;let price=prompt('Precio',p.price);if(price!==null&&Number(price)>=0)p.price=Number(price)||0;persist();products()}
function settings(){let c=db.company;$('app').innerHTML=`<div class="panel"><h2>Herramientas · Configuración de empresa</h2><div class="grid">${field('ename','Nombre de empresa',c.name)}${field('ephone','Teléfono',c.phone)}${field('eemail','Correo',c.email,'email')}${field('eaddress','Dirección',c.address)}${field('etax','Identificación fiscal',c.tax)}<div class="field"><label>Moneda</label><select id="ecurrency">${['USD','DOP','EUR','CAD','PRD'].filter(x=>x!=='PRD').map(x=>`<option ${c.currency===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Métodos de pago (Cash App, Zelle, transferencia, etc.)</label><textarea id="epayment">${esc(c.payment)}</textarea></div><div class="field"><label>Logo de empresa (imagen pequeña)</label><input id="elogo" type="file" accept="image/*"></div>${c.logo?`<img src="${c.logo}" alt="Logo" style="max-height:90px;max-width:180px">`:''}<div class="actions"><button onclick="saveSettings()">Guardar configuración</button><button class="secondary" onclick="backup()">Exportar copia de seguridad</button><label style="padding:11px;background:#e9eef7;border-radius:9px;cursor:pointer">Importar copia <input type="file" accept="application/json" onchange="restore(this)" style="display:none"></label></div><p class="muted">Los datos se guardan únicamente en este navegador. Exporta copias de seguridad regularmente. No borres los datos del navegador sin guardar una copia.</p></div>`}async function saveSettings(){let c=db.company;for(let [k,id] of Object.entries({name:'ename',phone:'ephone',email:'eemail',address:'eaddress',tax:'etax',currency:'ecurrency',payment:'epayment'}))c[k]=get(id);let f=$('elogo').files[0];if(f){if(f.size>350000)return alert('Utiliza un logo menor de 350 KB');c.logo=await new Promise((ok,bad)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=bad;r.readAsDataURL(f)})}persist();settings();toast('Configuración guardada')}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='factura-a-un-clic-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){let f=el.files[0];if(!f||!confirm('Esta acción reemplazará los datos actuales. ¿Continuar?'))return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.invoices)||!Array.isArray(d.clients)||!d.company)throw Error();db={...empty(),...d};persist();render();toast('Copia restaurada')}catch(e){alert('Archivo de respaldo no válido')}}function reports(){let total=db.invoices.reduce((a,x)=>a+x.total,0),month=today().slice(0,7),monthly=db.invoices.filter(x=>x.date?.startsWith(month)).reduce((a,x)=>a+x.total,0);$('app').innerHTML=`<h2>Informes</h2><div class="summary"><div class="panel"><span class="muted">Facturación registrada</span><p><strong>${money(total)}</strong></p></div><div class="panel"><span class="muted">Mes actual</span><p><strong>${money(monthly)}</strong></p></div><div class="panel"><span class="muted">Facturas emitidas</span><p><strong>${db.invoices.length}</strong></p></div></div><div class="panel"><h3>Resumen</h3><p>Clientes: ${db.clients.length} · Productos: ${db.products.length} · Presupuestos: ${db.quotes.length}</p><p class="muted">Estos importes corresponden a facturas registradas, no necesariamente a pagos recibidos.</p></div>`}render();
</script></body></html>
